        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background min-h-screen flex items-center justify-center p-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Main Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest border border-outline-variant rounded-xl elevation-2 p-xl flex flex-col gap-lg">
<!-- Header / Tenant Identification -->
<header class="flex flex-col items-center text-center gap-md pt-sm">
<div class="h-16 w-16 rounded-xl overflow-hidden border border-outline-variant bg-surface-container-low flex items-center justify-center shrink-0">
<img class="w-full h-full object-cover" data-alt="A sleek, modern corporate logo for a B2B CRM platform named Nexus CRM. The design features a minimalist, geometric 'N' mark integrated with connecting nodes, symbolizing networking and customer relationships. The color palette utilizes deep professional indigo and crisp white accents. The style is flat, clean, and highly scalable, suitable for a high-density productivity software interface. The background is a solid, subtle light grey." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA326C-IqpO1jRONT-Tw1pa559wti_Q7DAr2jtyxITyDe2GADckRD8uQXZXujFSdHLF9pPV__uz6gOB7f2f4kRTBV3Ljt6HJ6AOKnCOH729mU1jkXrIHhWB9xUPDz4YrY9rLJT6KD524O-uAmvRGAkmxMEjc_C0u8ubPuvJ1Q4ueEkZD50jQmfsYO_YutHycWopDD13bZ81vbzfYI8zKXaZW5jwSLIfV7WOq9ZqsmL-_DlkWZnwfeJ56MefkkYLIdcJH12kLKjjta54">
</div>
<div class="flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Nexus CRM</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Sign in to your workspace</p>
</div>
</header>
<!-- Login Form -->
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="flex flex-col gap-base">
<label class="font-label-md text-label-md text-on-surface" for="email">Email</label>
<div class="relative">
<input class="w-full h-[36px] px-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-DEFAULT outline-none transition-all placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-fixed" id="email" name="email" placeholder="name@company.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-on-primary-fixed-variant transition-colors hover:underline underline-offset-2" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-[36px] px-sm font-body-md text-body-md text-on-surface bg-surface-container-lowest border border-outline-variant rounded-DEFAULT outline-none transition-all placeholder:text-outline focus:border-primary focus:ring-2 focus:ring-primary-fixed" id="password" name="password" placeholder="••••••••" required="" type="password">
</div>
</div>
<!-- Submit Action -->
<div class="pt-sm">
<button class="w-full h-[36px] bg-primary text-on-primary font-label-md text-label-md rounded-DEFAULT hover:bg-on-primary-fixed-variant active:bg-primary transition-colors flex items-center justify-center gap-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface-container-lowest" type="submit">
                    Sign In
                </button>
</div>
</form>
<!-- Optional Footer Links / Help -->
<footer class="mt-xs text-center border-t border-outline-variant pt-md">
<p class="font-label-md text-label-md text-on-surface-variant">
                Don't have an account? <a class="text-primary hover:underline underline-offset-2" href="#">Contact Admin</a>
</p>
</footer>
</main>
</body></html>
