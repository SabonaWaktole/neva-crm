<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8f9ff; /* surface */
        }
        .card-shadow {
            box-shadow: 0px 4px 6px -1px rgba(0, 0, 0, 0.1), 0px 2px 4px -2px rgba(0, 0, 0, 0.05);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col min-h-screen text-on-surface">
<!-- Simple TopAppBar for Context (Based on Shared Components) -->
<header class="bg-surface dark:bg-on-surface w-full top-0 left-0 transition-all duration-200 active:opacity-80">
<div class="flex items-center px-lg h-16 w-full max-w-max-content-width mx-auto">
<span class="material-symbols-outlined text-primary mr-md cursor-pointer" data-icon="arrow_back">arrow_back</span>
<span class="font-headline-lg text-headline-lg font-bold text-primary">Nexus CRM</span>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-md py-xl">
<!-- Centered Mobile Card Layout -->
<div class="w-full max-w-[400px] bg-surface-container-lowest border border-outline-variant rounded-xl card-shadow overflow-hidden">
<div class="p-lg flex flex-col items-center text-center">
<!-- Reset Icon Container -->
<div class="w-14 h-14 bg-primary-container rounded-full flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-on-primary-container text-[32px]" data-icon="lock_reset">lock_reset</span>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-on-surface mb-sm">Forgot Password</h1>
<!-- Subtext -->
<p class="font-body-md text-body-md text-on-surface-variant mb-xl px-sm">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
<!-- Form -->
<form class="w-full text-left" onsubmit="event.preventDefault();">
<div class="mb-lg">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base ml-xs" for="email">
                            Email Address
                        </label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-outline" data-icon="mail">mail</span>
<input class="w-full h-[48px] pl-[44px] pr-md bg-surface border border-outline-variant rounded-lg font-body-md text-body-md focus:outline-none focus:ring-2 focus:ring-primary-container focus:border-primary transition-all" id="email" placeholder="name@company.com" type="email">
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full h-[48px] bg-primary text-on-primary font-headline-md text-headline-md rounded-lg flex items-center justify-center hover:bg-primary-container transition-colors duration-200 active:opacity-90">
                        Send Reset Link
                    </button>
</form>
<!-- Footer Separator -->
<div class="w-full flex items-center my-xl">
<div class="flex-grow border-t border-outline-variant"></div>
</div>
<!-- Back to Login Link -->
<a class="flex items-center justify-center gap-xs text-primary font-label-md text-label-md hover:underline transition-all" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </a>
</div>
<!-- Contextual Visual Decorative Element (Low-contrast outline pattern) -->
<div class="h-2 w-full bg-primary-container"></div>
</div>
</main>
<!-- Footer (Based on Shared Components) -->
<footer class="bg-background border-t border-outline-variant w-full bottom-0 transition-colors duration-150">
<div class="flex flex-col md:flex-row justify-between items-center py-xl px-lg w-full max-w-max-content-width mx-auto">
<span class="font-label-md text-label-md text-on-surface-variant mb-md md:mb-0">© 2026 CRM. All rights reserved.</span>
<div class="flex gap-lg">
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors" href="#">Terms</a>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors" href="#">Contact</a>
</div>
</div>
</footer>
<!-- Micro-interaction script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.querySelector('button');
            const input = document.querySelector('input');
            
            btn.addEventListener('click', () => {
                if(input.value) {
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin mr-sm">sync</span> Sending...';
                    setTimeout(() => {
                        btn.innerHTML = '<span class="material-symbols-outlined mr-sm">check_circle</span> Link Sent';
                        btn.classList.remove('bg-primary');
                        btn.classList.add('bg-secondary-container', 'text-on-secondary-container');
                    }, 1500);
                } else {
                    input.classList.add('border-error');
                    setTimeout(() => input.classList.remove('border-error'), 2000);
                }
            });
        });
    </script>
</body></html>
