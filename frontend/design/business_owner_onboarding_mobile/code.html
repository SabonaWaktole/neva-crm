<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col items-center justify-center p-md">
<!-- Top Navigation (Suppressed for Linear Intent, keeping a back button for safety) -->
<header class="w-full max-w-md flex justify-between items-center py-md absolute top-0 left-0 px-md">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-xs">
<span class="material-symbols-outlined" style="font-size: 20px;">arrow_back</span>
<span class="font-label-md text-label-md">Back</span>
</button>
<div class="font-label-md text-label-md text-primary">Need Help?</div>
</header>
<!-- Main Container -->
<main class="w-full max-w-md flex flex-col gap-xl mt-xl">
<!-- Header -->
<div class="text-center flex flex-col gap-sm mt-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Tell us about your organization</h1>
<p class="font-body-md text-body-md text-on-surface-variant">This information helps us set up your workspace and customize your experience.</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center justify-center gap-sm">
<div class="w-16 h-2 rounded-full bg-primary"></div>
<div class="w-16 h-2 rounded-full bg-surface-variant"></div>
<div class="w-16 h-2 rounded-full bg-surface-variant"></div>
</div>
<!-- Form Area -->
<div class="bg-surface rounded-xl p-lg shadow-sm border border-outline-variant flex flex-col gap-lg">
<!-- Company Name -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="company-name">Organization Name</label>
<input class="h-[36px] w-full px-md border border-outline-variant rounded-lg font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-fixed bg-surface-container-lowest transition-all" id="company-name" placeholder="Acme Corp" type="text">
</div>
<!-- Workspace URL Preview -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="workspace-url">Workspace URL</label>
<div class="flex items-center border border-outline-variant rounded-lg overflow-hidden bg-surface-container-lowest focus-within:border-primary focus-within:ring-2 focus-within:ring-primary-fixed transition-all h-[36px]">
<span class="px-md bg-surface-container-low font-body-md text-body-md text-on-surface-variant h-full flex items-center border-r border-outline-variant">nexuscrm.com/</span>
<input class="flex-1 px-md h-full border-none font-body-md text-body-md text-on-surface focus:outline-none bg-transparent" id="workspace-url" placeholder="acme" type="text">
</div>
</div>
<!-- Logo Upload Placeholder -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Organization Logo (Optional)</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-lg flex flex-col items-center justify-center gap-sm hover:border-primary transition-colors cursor-pointer bg-surface-container-lowest">
<div class="w-12 h-12 rounded-full bg-surface-container-high flex items-center justify-center text-primary">
<span class="material-symbols-outlined" style="font-size: 24px;">add_photo_alternate</span>
</div>
<span class="font-body-md text-body-md text-on-surface-variant text-center">Tap to upload or drag and drop<br><span class="text-xs">PNG, JPG up to 5MB</span></span>
</div>
</div>
</div>
</main>
<!-- Bottom Fixed Actions -->
<footer class="w-full max-w-md fixed bottom-0 left-0 right-0 mx-auto p-md bg-background/80 backdrop-blur-md border-t border-outline-variant z-10 flex gap-md">
<button class="flex-1 bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md h-[44px] rounded-lg flex items-center justify-center transition-colors shadow-sm">
