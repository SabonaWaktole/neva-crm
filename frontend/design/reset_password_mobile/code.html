        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center p-md">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
<!-- Header -->
<div class="mb-xl text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-sm">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Please enter your new password below to secure your account.
            </p>
</div>
<!-- Form -->
<form class="space-y-lg">
<!-- New Password Field -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-9 pl-[36px] pr-sm bg-surface rounded border border-outline-variant text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all" id="new-password" placeholder="Enter new password" type="password"/>
</div>
</div>
<!-- Password Strength Indicator -->
<div class="space-y-xs">
<div class="flex justify-between items-center mb-xs">
<span class="font-label-sm text-label-sm text-on-surface-variant">Password Strength</span>
<span class="font-label-sm text-label-sm text-secondary font-medium">Moderate</span>
</div>
<div class="flex gap-xs h-1 w-full rounded-full overflow-hidden bg-surface-variant">
<div class="h-full bg-secondary w-1/3 transition-all duration-300"></div>
<div class="h-full bg-secondary w-1/3 transition-all duration-300 opacity-50"></div>
<div class="h-full bg-transparent w-1/3"></div>
</div>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-sm">
                    Use at least 8 characters, including numbers and symbols.
                </p>
</div>
<!-- Confirm Password Field -->
<div class="space-y-sm mt-md">
<label class="block font-label-md text-label-md text-on-surface" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock_reset</span>
<input class="w-full h-9 pl-[36px] pr-sm bg-surface rounded border border-outline-variant text-on-surface focus:border-primary focus:ring-2 focus:ring-primary-fixed focus:outline-none transition-all" id="confirm-password" placeholder="Confirm new password" type="password"/>
</div>
</div>
<!-- Actions -->
<div class="pt-md">
<button class="w-full bg-primary hover:bg-[#2a1c9e] text-on-primary font-label-md text-label-md h-9 rounded transition-colors flex items-center justify-center gap-sm" type="submit">
                    Reset Password
                    <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Back Link -->
<div class="text-center mt-lg">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
                    Back to Login
                </a>
</div>
</form>
</main>
</body></html>
