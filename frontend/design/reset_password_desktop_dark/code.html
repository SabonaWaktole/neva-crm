<style>

<body class="flex flex-col min-h-screen text-on-surface antialiased overflow-hidden">
<!-- Top Navigation Bar (Shared Component) -->
<header class="bg-surface dark:bg-on-surface w-full top-0 left-0">
<div class="flex items-center px-lg h-16 w-full max-w-[1440px] mx-auto">
<div class="flex items-center gap-md">

<span class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed">SaaS CRM</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center p-md relative">
<!-- Atmospheric Background Element -->
<div class="absolute inset-0 pointer-events-none">

</div>
<!-- Reset Password Card -->
<div class="relative z-10 w-full max-w-[480px]">
<div class="bg-[#1e293b] rounded-xl border border-[#334155] p-xl shadow-2xl">
<!-- Card Header -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-surface-container-high mb-md border border-outline-variant">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Set New Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Your new password must be different from previous ones.</p>
</div>
<!-- Reset Form -->
<form class="space-y-lg" id="resetForm" onsubmit="event.preventDefault()">
<!-- New Password Field -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="new-password">New Password</label>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface-container-low border border-[#334155] rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="new-password" oninput="updatePasswordStrength(this.value)" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="space-y-xs pt-1">
<div class="flex gap-1">
<div class="password-strength-segment bg-surface-container-highest flex-1" id="strength-1"></div>
<div class="password-strength-segment bg-surface-container-highest flex-1" id="strength-2"></div>
<div class="password-strength-segment bg-surface-container-highest flex-1" id="strength-3"></div>
<div class="password-strength-segment bg-surface-container-highest flex-1" id="strength-4"></div>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-on-surface-variant" id="strength-text">Strength</span>
<span class="font-label-sm text-label-sm text-primary">At least 8 characters</span>
</div>
</div>
</div>
<!-- Confirm Password Field -->
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface-variant" for="confirm-password">Confirm New Password</label>
<div class="relative group">
<input class="w-full h-12 px-md bg-surface-container-low border border-[#334155] rounded-lg text-on-surface placeholder:text-outline-variant focus:ring-2 focus:ring-primary focus:border-transparent transition-all outline-none" id="confirm-password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined" data-icon="visibility">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary text-on-primary font-label-md text-label-md rounded-lg hover:opacity-90 active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-sm" type="submit">
                        Reset Password

<span class="material-symbols-outlined text-[18px]" data-icon="arrow_back">arrow_back</span>

<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-150" href="#">Contact</a>
</div>

<script>
        function updatePasswordStrength(val) {
            const s1 = document.getElementById('strength-1');
            const s2 = document.getElementById('strength-2');
            const s3 = document.getElementById('strength-3');
            const s4 = document.getElementById('strength-4');
            const text = document.getElementById('strength-text');

            // Reset
            [s1, s2, s3, s4].forEach(s => {
                s.className = 'password-strength-segment bg-surface-container-highest flex-1';
            });

            let strength = 0;
            if (val.length > 0) strength++;
            if (val.length >= 8) strength++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
            if (/[^A-Za-z0-9]/.test(val)) strength++;

            if (strength >= 1) {
                s1.classList.remove('bg-surface-container-highest');
                s1.classList.add('bg-error');
                text.innerText = 'Weak';
                text.className = 'font-label-sm text-label-sm text-error';
            }
            if (strength >= 2) {
                s2.classList.remove('bg-surface-container-highest');
                s2.classList.add('bg-tertiary');
                text.innerText = 'Fair';
                text.className = 'font-label-sm text-label-sm text-tertiary';
            }
            if (strength >= 3) {
                s3.classList.remove('bg-surface-container-highest');
                s3.classList.add('bg-primary-container');
                text.innerText = 'Good';
                text.className = 'font-label-sm text-label-sm text-primary-container';
            }
            if (strength >= 4) {
                s4.classList.remove('bg-surface-container-highest');
                s4.classList.add('bg-primary');
                text.innerText = 'Strong';
                text.className = 'font-label-sm text-label-sm text-primary';
            }
            
            if (val.length === 0) {
                text.innerText = 'Strength';
                text.className = 'font-label-sm text-label-sm text-on-surface-variant';
            }
        }

        // Simple Toggle for visibility (UI only)
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.previousElementSibling;
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.innerText = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.innerText = 'visibility';
                }
            });
        });
    </script>
