<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add/Edit Client - Nexus CRM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "on-surface": "#0b1c30",

                        "primary": "#3525cd",
                        "error-container": "#ffdad6",
                        "surface-tint": "#4d44e3",
                        "secondary-fixed": "#c9e6ff",
                        "outline": "#777587",
                        "on-secondary-fixed-variant": "#004c6e",
                        "on-primary": "#ffffff",
                        "surface-variant": "#d3e4fe",
                        "secondary-container": "#39b8fd",
                        "inverse-on-surface": "#eaf1ff",
                        "on-tertiary-container": "#ffd2be",
                        "outline-variant": "#c7c4d8",
                        "on-error-container": "#93000a",
                        "on-tertiary-fixed-variant": "#7b2f00",
                        "background": "#f8f9ff",
                        "surface-container-high": "#dce9ff",
                        "inverse-primary": "#c3c0ff",

                        "tertiary-container": "#a44100",

                        "secondary-fixed-dim": "#89ceff",
                        "surface-container": "#e5eeff",
                        "on-background": "#0b1c30",
                        "on-secondary-fixed": "#001e2f",
                        "on-primary-fixed-variant": "#3323cc",
                        "surface-container-highest": "#d3e4fe",
                        "on-error": "#ffffff",
                        "primary-fixed": "#e2dfff",
                        "on-secondary-container": "#004666",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#c3c0ff",
                        "on-tertiary": "#ffffff",
                        "on-tertiary-fixed": "#351000",
                        "surface-dim": "#cbdbf5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "md": "16px",
                        "lg": "24px",
                        "base": "4px",
                        "sm": "8px",
                        "xl": "32px",
                        "sidebar-collapsed": "64px",
                        "xs": "4px",
                        "2xl": "48px",

                        "sidebar-width": "240px"
                    },
                    "fontFamily": {

<style>
        .form-input-ring:focus {
            box-shadow: 0 0 0 2px rgba(53, 37, 205, 0.2);
            border-color: #3525cd;
            outline: none;
        }
        /* Mobile height fix for fixed button */
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body-md min-h-screen flex flex-col antialiased pb-[80px]">
<!-- Top App Bar (Task-focused, so distinct from main dashboard nav) -->
<header class="bg-surface-container flex justify-between items-center w-full px-md h-16 border-b border-outline-variant sticky top-0 z-10">
<button class="text-on-surface-variant hover:bg-secondary-container/20 p-2 rounded-full transition-colors active:opacity-80 flex items-center justify-center" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface text-center flex-1 pr-10">Add Client</h1>
<!-- Invisible spacer to balance the flex layout -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-md py-lg space-y-lg max-w-md mx-auto w-full">
<!-- Profile Photo Upload -->
<section class="flex flex-col items-center justify-center space-y-sm pt-sm">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden transition-colors group-hover:border-primary group-hover:bg-surface-container-highest">
<span class="material-symbols-outlined text-on-surface-variant text-[32px] group-hover:text-primary transition-colors" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
</div>
<p class="font-label-md text-label-md text-on-surface-variant text-center">Upload Photo</p>
</section>
<form class="space-y-lg flex-1">
<!-- Basic Info Section -->
<section class="space-y-sm">
<h2 class="font-headline-md text-headline-md text-on-surface pb-2">Basic Info</h2>
<div class="space-y-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="firstName">First Name *</label>
<input class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm font-body-md text-body-md text-on-surface placeholder-outline form-input-ring transition-shadow" id="firstName" name="firstName" placeholder="e.g. Jane" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="lastName">Last Name *</label>
<input class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm font-body-md text-body-md text-on-surface placeholder-outline form-input-ring transition-shadow" id="lastName" name="lastName" placeholder="e.g. Doe" required="" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="email">Email Address *</label>
<input class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm font-body-md text-body-md text-on-surface placeholder-outline form-input-ring transition-shadow" id="email" name="email" placeholder="jane.doe@example.com" required="" type="email"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="phone">Phone Number</label>
<input class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm font-body-md text-body-md text-on-surface placeholder-outline form-input-ring transition-shadow" id="phone" name="phone" placeholder="(555) 123-4567" type="tel"/>
</div>
</div>
</section>
<!-- Assignment Section -->
<section class="space-y-sm pt-sm">
<h2 class="font-headline-md text-headline-md text-on-surface pb-2">Assignment</h2>
<div class="space-y-sm">
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="company">Company</label>
<input class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm font-body-md text-body-md text-on-surface placeholder-outline form-input-ring transition-shadow" id="company" name="company" placeholder="Acme Corp" type="text"/>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="status">Status</label>
<div class="relative">
<select class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm pr-lg font-body-md text-body-md text-on-surface appearance-none form-input-ring transition-shadow" id="status" name="status">
<option value="lead">Lead</option>
<option value="active">Active Client</option>
<option value="inactive">Inactive</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size: 20px;">expand_more</span>
</div>
</div>
<div>
<label class="block font-label-md text-label-md text-on-surface mb-xs" for="assignee">Assigned To</label>
<div class="relative">
<select class="w-full h-[36px] bg-surface rounded-lg border border-[#E2E8F0] px-sm pr-lg font-body-md text-body-md text-on-surface appearance-none form-input-ring transition-shadow" id="assignee" name="assignee">
<option value="unassigned">Unassigned</option>
<option value="me">Me</option>
<option value="sarah">Sarah Connor</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none" style="font-size: 20px;">expand_more</span>
</div>
</div>
</div>
</section>
</form>
</main>
<!-- Fixed Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-surface border-t border-outline-variant p-md pb-safe shadow-[0px_-4px_6px_-1px_rgba(0,0,0,0.05)] z-20">
<div class="max-w-md mx-auto flex gap-sm">
<button class="flex-1 bg-surface border border-slate-200 text-slate-900 rounded-lg h-10 font-label-md text-label-md flex items-center justify-center transition-colors active:bg-slate-50" type="button">
                Cancel
            </button>
<button class="flex-1 bg-primary text-on-primary rounded-lg h-10 font-label-md text-label-md flex items-center justify-center transition-colors hover:bg-primary-container active:scale-95 duration-100 shadow-sm" type="submit">
                Save Client
            </button>
</div>
</div>
</body></html>
