<body class="bg-background min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop font-body-md text-on-surface antialiased selection:bg-primary-container selection:text-on-primary-container">

<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary-fixed to-inverse-primary"></div>
<div class="p-lg md:p-xl flex flex-col gap-lg">
<div class="flex flex-col items-center text-center gap-md mb-sm">
<div class="w-12 h-12 bg-surface-container-high rounded-lg flex items-center justify-center border border-outline-variant mb-sm">
<span class="material-symbols-outlined text-primary font-headline-md" style="font-variation-settings: 'FILL' 1;">
                        lock_reset
                    </span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                    Enter the email address associated with your account, and we'll send you a link to reset your password.
                </p>
</div>
<form class="flex flex-col gap-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline font-label-md" style="font-variation-settings: 'FILL' 0;">
                                mail
                            </span>
</div>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg py-sm pl-xl pr-sm font-body-md text-on-surface placeholder:text-outline focus:outline-none focus:ring-1 focus:ring-primary focus:border-primary transition-all duration-200" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-inverse-primary hover:bg-primary-container text-surface-container-lowest font-label-md text-label-md py-sm px-lg rounded-lg transition-colors duration-200 mt-sm flex items-center justify-center gap-sm" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined font-label-md" style="font-variation-settings: 'FILL' 0;">
                        arrow_forward
                    </span>
</button>
</form>
<div class="pt-sm border-t border-surface-container-highest text-center mt-sm">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-primary-fixed transition-colors duration-200" href="#">
<span class="material-symbols-outlined font-label-sm" style="font-variation-settings: 'FILL' 0;">
                        arrow_back
                    </span>
                    Back to Login
                </a>
</div>
</div>
</div>
