<body class="h-full flex flex-col justify-center items-center bg-background px-md">
<div class="w-full max-w-sm bg-surface-container-lowest border border-outline-variant rounded-xl p-lg shadow-sm">
<div class="text-center mb-xl">
<div class="inline-flex justify-center items-center w-12 h-12 rounded-full bg-primary-container text-on-primary-container mb-md">
<span class="material-symbols-outlined text-headline-lg-mobile" style="font-variation-settings: 'FILL' 1;">dataset</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-xs">Sign in to Nexus CRM</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Access your corporate workspace.</p>
</div>
<form class="space-y-md">
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="tenant">Organization ID</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">domain</span>
<input class="w-full pl-10 pr-3 h-[36px] bg-surface border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="tenant" name="tenant" placeholder="e.g. corp-modern" required="" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-10 pr-3 h-[36px] bg-surface border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="block font-label-md text-label-md text-on-surface" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-10 pr-10 h-[36px] bg-surface border border-outline-variant rounded focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 font-body-md text-body-md text-on-surface placeholder-on-surface-variant transition-colors" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-body-lg">visibility_off</span>
</button>
</div>
</div>
<button class="w-full h-[36px] mt-lg bg-primary hover:bg-primary-container text-on-primary font-label-md text-label-md rounded flex items-center justify-center transition-colors active:opacity-80 shadow-[0_1px_2px_rgba(0,0,0,0.05)]" type="submit">
                Sign In
            </button>
</form>
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Need an account? <a class="text-primary hover:text-primary-container font-label-md transition-colors" href="#">Contact Administrator</a>
</p>
</div>
</div>
