<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus CRM - Add Client</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-primary": "#494bd6",
                        "primary-fixed-dim": "#c0c1ff",
                        "on-secondary": "#233143",
                        "on-tertiary": "#4f2500",
                        "tertiary-fixed": "#ffdcc5",
                        "primary-fixed": "#e1e0ff",
                        "on-primary": "#1000a9",
                        "surface-bright": "#31394d",
                        "on-tertiary-fixed": "#301400",
                        "secondary": "#b9c8de",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "on-primary-fixed": "#07006c",
                        "secondary-fixed-dim": "#b9c8de",
                        "secondary-fixed": "#d4e4fa",
                        "surface-container-highest": "#2d3449",
                        "on-surface-variant": "#c7c4d7",
                        "on-background": "#dae2fd",
                        "on-tertiary-container": "#452000",
                        "inverse-on-surface": "#283044",
                        "tertiary-fixed-dim": "#ffb783",
                        "surface-container": "#171f33",
                        "on-error-container": "#ffdad6",
                        "inverse-surface": "#dae2fd",
                        "outline-variant": "#464554",
                        "on-secondary-fixed-variant": "#39485a",
                        "on-secondary-fixed": "#0d1c2d",
                        "on-primary-container": "#0d0096",
                        "tertiary-container": "#d97721",
                        "tertiary": "#ffb783",
                        "surface-container-high": "#222a3d",
                        "primary": "#c0c1ff",
                        "on-tertiary-fixed-variant": "#703700",
                        "error": "#ffb4ab",
                        "surface-dim": "#0b1326",
                        "outline": "#908fa0",
                        "surface-container-lowest": "#060e20",
                        "primary-container": "#8083ff",
                        "on-primary-fixed-variant": "#2f2ebe",
                        "background": "#0b1326",
                        "surface-container-low": "#131b2e",
                        "on-secondary-container": "#a7b6cc",
                        "surface": "#0b1326",
                        "on-surface": "#dae2fd",
                        "surface-tint": "#c0c1ff",
                        "secondary-container": "#39485a",
                        "surface-variant": "#2d3449"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "24px",
                        "margin-desktop": "40px",
                        "unit": "4px",
                        "xs": "4px",
                        "md": "16px",
                        "gutter": "24px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "headline-sm": ["Inter"],
                        "headline-lg-mobile": ["Inter"],
                        "body-sm": ["Inter"],
                        "label-sm": ["Inter"],
                        "headline-lg": ["Inter"],
                        "label-md": ["Inter"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", {"lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "body-md": ["16px", {"lineHeight": "24px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "headline-sm": ["20px", {"lineHeight": "28px", "letterSpacing": "0em", "fontWeight": "600"}],
                        "headline-lg-mobile": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0em", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "500"}]
                    }
                }
            }
        }
    </script>
<style>
        /* Hide scrollbar for cleaner mobile look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
        
        /* Form element resets for consistency */
        input:focus, select:focus, textarea:focus {
            outline: none;
            box-shadow: 0 0 0 1px theme('colors.primary');
            border-color: theme('colors.primary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface h-screen w-full flex flex-col font-body-md overflow-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Contextual Header for Transactional Screen (Suppresses standard TopAppBar) -->
<header class="flex justify-between items-center w-full px-md h-16 bg-surface-container border-b border-outline-variant shrink-0 z-10">
<button class="text-on-surface-variant hover:text-on-surface active:scale-95 transition-all p-sm rounded-full flex items-center justify-center -ml-sm" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm font-bold text-on-surface">New Client</h1>
<button class="text-primary font-label-md text-label-md font-bold px-sm py-xs rounded hover:bg-primary-container/10 active:opacity-80 transition-colors" type="button">
            Save
        </button>
</header>
<!-- Scrollable Form Content -->
<main class="flex-1 overflow-y-auto w-full pb-32">
<div class="px-margin-mobile py-lg max-w-2xl mx-auto space-y-xl">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center justify-center">
<div class="relative group cursor-pointer">
<div class="w-24 h-24 rounded-full bg-surface-container-highest border border-outline-variant flex items-center justify-center text-on-surface-variant overflow-hidden">
<span class="material-symbols-outlined text-[32px]">add_a_photo</span>
</div>
<div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-active:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white">upload</span>
</div>
</div>
</section>
<!-- Standard Fields -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Basic Information</h2>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Full Name</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">person</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-10 pr-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent" placeholder="e.g. Jane Doe" type="text"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">mail</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-10 pr-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent" placeholder="jane@company.com" type="email"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Phone Number</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">phone</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-10 pr-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent" placeholder="+1 (555) 000-0000" type="tel"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Status</label>
<div class="relative">
<select class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-sm pr-10 text-body-md text-on-surface appearance-none focus:border-primary transition-colors bg-transparent">
<option value="lead">Lead</option>
<option value="active">Active Client</option>
<option value="inactive">Inactive</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</section>
<hr class="border-outline-variant"/>
<!-- Assignment Section -->
<section class="space-y-md">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-sm">Assignment</h2>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Assign Staff</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">search</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-10 pr-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent" placeholder="Search team members..." type="text"/>
</div>
<!-- Selected Staff Chips -->
<div class="flex flex-wrap gap-xs mt-sm">
<div class="inline-flex items-center gap-xs bg-surface-container-high border border-outline-variant rounded-full pl-xs pr-sm py-1">
<div class="w-6 h-6 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center font-label-sm text-[10px]">
                                AM
                            </div>
<span class="font-label-sm text-label-sm text-on-surface">Alex Mercer</span>
<button class="flex items-center text-on-surface-variant hover:text-error transition-colors"><span class="material-symbols-outlined text-[14px]">close</span></button>
</div>
</div>
</div>
</section>
<hr class="border-outline-variant"/>
<!-- Company-Specific Information -->
<section class="space-y-md">
<div class="flex items-center justify-between mb-sm">
<h2 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Company Data</h2>
<span class="material-symbols-outlined text-on-surface-variant text-[18px]">business_center</span>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Est. Contract Value</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-sm text-on-surface-variant">attach_money</span>
<input class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-10 pr-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent" placeholder="0.00" type="number"/>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Lead Source</label>
<div class="relative">
<select class="w-full bg-surface-container border border-outline-variant rounded-lg py-sm pl-sm pr-10 text-body-md text-on-surface appearance-none focus:border-primary transition-colors bg-transparent">
<option value="">Select source...</option>
<option value="referral">Client Referral</option>
<option value="website">Website Form</option>
<option value="event">Industry Event</option>
<option value="outbound">Outbound Sales</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<div class="space-y-sm">
<label class="block font-label-md text-label-md text-on-surface">Internal Notes</label>
<textarea class="w-full bg-surface-container border border-outline-variant rounded-lg p-sm text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary transition-colors bg-transparent resize-none" placeholder="Add any specific context or requirements..." rows="3"></textarea>
</div>
</section>
</div>
</main>
<!-- Fixed Bottom Bar for Primary Action (Optimized for Mobile Reach) -->
<div class="fixed bottom-0 left-0 w-full bg-surface/80 backdrop-blur-md border-t border-outline-variant p-md z-20 pb-safe">
<button class="w-full bg-primary text-on-primary font-headline-sm text-headline-sm py-sm rounded-lg hover:bg-primary-fixed transition-colors active:scale-[0.98] flex items-center justify-center gap-xs">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            Save Client
        </button>
</div>
</body></html>
