<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nexus CRM - Reset Password</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed-dim": "#ffb695",
                      "surface-container-high": "#dce9ff",
                      "tertiary-container": "#a44100",
                      "secondary": "#006591",
                      "primary-fixed-dim": "#c3c0ff",
                      "surface-tint": "#4d44e3",
                      "on-secondary-container": "#004666",
                      "surface-container-lowest": "#ffffff",
                      "on-primary": "#ffffff",
                      "surface-bright": "#f8f9ff",
                      "on-error": "#ffffff",
                      "primary": "#3525cd",
                      "on-tertiary-fixed": "#351000",
                      "surface-container": "#e5eeff",
                      "tertiary-fixed": "#ffdbcc",
                      "surface-dim": "#cbdbf5",
                      "error": "#ba1a1a",
                      "on-primary-fixed": "#0f0069",
                      "primary-container": "#4f46e5",
                      "tertiary": "#7e3000",
                      "on-secondary-fixed-variant": "#004c6e",
                      "secondary-fixed": "#c9e6ff",
                      "surface-variant": "#d3e4fe",
                      "on-error-container": "#93000a",
                      "outline": "#777587",
                      "primary-fixed": "#e2dfff",
                      "on-surface-variant": "#464555",
                      "on-primary-container": "#dad7ff",
                      "inverse-primary": "#c3c0ff",
                      "on-tertiary": "#ffffff",
                      "outline-variant": "#c7c4d8",
                      "on-secondary": "#ffffff",
                      "on-tertiary-container": "#ffd2be",
                      "background": "#f8f9ff",
                      "on-surface": "#0b1c30",
                      "on-tertiary-fixed-variant": "#7b2f00",
                      "on-secondary-fixed": "#001e2f",
                      "on-primary-fixed-variant": "#3323cc",
                      "secondary-container": "#39b8fd",
                      "on-background": "#0b1c30",
                      "inverse-on-surface": "#eaf1ff",
                      "surface-container-low": "#eff4ff",
                      "inverse-surface": "#213145",
                      "error-container": "#ffdad6",
                      "surface-container-highest": "#d3e4fe",
                      "surface": "#f8f9ff",
                      "secondary-fixed-dim": "#89ceff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "2xl": "48px",
                      "xl": "32px",
                      "lg": "24px",
                      "max-content-width": "1280px",
                      "sidebar-width": "240px",
                      "md": "16px",
                      "base": "4px",
                      "xs": "4px",
                      "sm": "8px",
                      "sidebar-collapsed": "64px"
              },
              "fontFamily": {
                      "body-md": ["Inter"],
                      "headline-md": ["Inter"],
                      "headline-lg-mobile": ["Inter"],
                      "display": ["Inter"],
                      "body-lg": ["Inter"],
                      "label-sm": ["Inter"],
                      "headline-lg": ["Inter"],
                      "label-md": ["Inter"]
              },
              "fontSize": {
                      "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                      "headline-md": ["18px", {"lineHeight": "26px", "fontWeight": "600"}],
                      "headline-lg-mobile": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                      "display": ["36px", {"lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                      "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                      "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "600"}],
                      "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                      "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}]
              }
            }
          }
        }
    </script>
<style>
        /* Strength bar animations */
        .strength-weak { width: 33.33%; background-color: #ba1a1a; transition: width 0.3s ease, background-color 0.3s ease; }
        .strength-medium { width: 66.66%; background-color: #a44100; transition: width 0.3s ease, background-color 0.3s ease; }
        .strength-strong { width: 100%; background-color: #006591; transition: width 0.3s ease, background-color 0.3s ease; }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="h-full bg-background font-body-md text-on-background flex items-center justify-center p-md lg:p-lg">
<!-- Main Container -->
<main class="w-full max-w-md bg-surface-container-lowest border border-outline-variant rounded-xl shadow-[0px_4px_6px_-1px_rgba(0,0,0,0.1),0px_2px_4px_-2px_rgba(0,0,0,0.05)] overflow-hidden flex flex-col relative z-10">
<!-- Header Section -->
<header class="p-xl pb-lg flex flex-col items-center border-b border-outline-variant/30 text-center relative">
<div class="mb-lg h-12 w-12 rounded-full bg-primary-container/10 flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[28px]" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-sm">Set New Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                Please enter a strong password that you haven't used before.
            </p>
</header>
<!-- Form Section -->
<form action="#" class="p-xl pt-lg flex flex-col gap-lg" id="resetForm" method="POST">
<!-- New Password Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="new_password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full h-[36px] pl-[36px] pr-sm rounded border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline/70" id="new_password" name="new_password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-sm top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant transition-colors" id="toggleNewPwd" type="button">
<span class="material-symbols-outlined text-[18px]" data-icon="visibility_off">visibility_off</span>
</button>
</div>
<!-- Password Strength Indicator -->
<div class="flex flex-col gap-xs mt-sm" id="strengthContainer">
<div class="h-1 w-full bg-surface-variant rounded-full overflow-hidden flex">
<!-- Bar fills based on input -->
<div class="h-full bg-surface-variant w-0" id="strengthBar"></div>
</div>
<div class="flex justify-between items-center">
<span class="font-label-sm text-label-sm text-outline" id="strengthLabel">Password strength</span>
<span class="font-label-sm text-label-sm text-outline hidden" id="strengthText"></span>
</div>
<!-- Requirements list (optional/contextual) -->
<ul class="font-label-sm text-label-sm text-on-surface-variant mt-sm flex flex-col gap-[2px]">
<li class="flex items-center gap-xs opacity-60 transition-opacity" id="req-length">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                            At least 8 characters
                        </li>
<li class="flex items-center gap-xs opacity-60 transition-opacity" id="req-complex">
<span class="material-symbols-outlined text-[14px]">check_circle</span>
                            Number &amp; special character
                        </li>
</ul>
</div>
</div>
<!-- Confirm Password Input -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="confirm_password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" data-icon="lock_clock">lock_clock</span>
<input class="w-full h-[36px] pl-[36px] pr-sm rounded border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary-container/20 transition-all placeholder:text-outline/70" id="confirm_password" name="confirm_password" placeholder="••••••••" required="" type="password"/>
</div>
<span class="font-label-sm text-label-sm text-error hidden mt-xs" id="matchError">Passwords do not match.</span>
</div>
<!-- Submit Action -->
<div class="mt-sm flex flex-col gap-lg">
<button class="w-full h-[36px] bg-primary text-on-primary font-label-md text-label-md rounded hover:bg-primary-container active:bg-primary-fixed-variant transition-colors flex items-center justify-center" type="submit">
                    Reset Password
                </button>
</div>
</form>
<!-- Footer / Navigation -->
<footer class="p-lg pt-0 flex justify-center border-t border-outline-variant/30 bg-surface/50 mt-auto">
<a class="mt-lg font-label-md text-label-md text-primary hover:text-primary-container transition-colors flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[16px]" data-icon="arrow_back">arrow_back</span>
                Back to Login
            </a>
</footer>
</main>
<!-- Decorative Background Elements (Corporate Modern style: clean, structured) -->
<div class="fixed inset-0 pointer-events-none z-0 overflow-hidden">
<div class="absolute top-0 right-0 w-1/2 h-1/2 bg-gradient-to-bl from-surface-container-low to-transparent opacity-50"></div>
<div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-gradient-to-tr from-surface-dim to-transparent opacity-30"></div>
</div>
<!-- Script for interactive elements (Strength & Match) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const pwdInput = document.getElementById('new_password');
            const confirmInput = document.getElementById('confirm_password');
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            const reqLength = document.getElementById('req-length');
            const reqComplex = document.getElementById('req-complex');
            const matchError = document.getElementById('matchError');
            const toggleNewPwd = document.getElementById('toggleNewPwd');
            const toggleIcon = toggleNewPwd.querySelector('span');

            // Visibility Toggle
            toggleNewPwd.addEventListener('click', () => {
                const type = pwdInput.getAttribute('type') === 'password' ? 'text' : 'password';
                pwdInput.setAttribute('type', type);
                toggleIcon.textContent = type === 'password' ? 'visibility_off' : 'visibility';
                toggleIcon.setAttribute('data-icon', type === 'password' ? 'visibility_off' : 'visibility');
            });

            // Password Strength Logic (Simplified for UI demo)
            pwdInput.addEventListener('input', (e) => {
                const val = e.target.value;
                strengthText.classList.remove('hidden');
                
                // Length check
                const hasLength = val.length >= 8;
                if(hasLength) {
                    reqLength.classList.remove('opacity-60');
                    reqLength.querySelector('span').classList.add('text-secondary');
                } else {
                    reqLength.classList.add('opacity-60');
                    reqLength.querySelector('span').classList.remove('text-secondary');
                }

                // Complexity check (Number + Special Char)
                const hasComplex = /[0-9]/.test(val) && /[^A-Za-z0-9]/.test(val);
                if(hasComplex) {
                    reqComplex.classList.remove('opacity-60');
                    reqComplex.querySelector('span').classList.add('text-secondary');
                } else {
                    reqComplex.classList.add('opacity-60');
                    reqComplex.querySelector('span').classList.remove('text-secondary');
                }

                // Set Bar & Text State
                strengthBar.className = 'h-full'; // reset
                if (val.length === 0) {
                    strengthBar.style.width = '0%';
                    strengthText.textContent = '';
                    strengthText.classList.add('hidden');
                } else if (val.length < 6) {
                    strengthBar.classList.add('strength-weak');
                    strengthText.textContent = 'Weak';
                    strengthText.className = 'font-label-sm text-label-sm text-error';
                } else if (hasLength && !hasComplex) {
                    strengthBar.classList.add('strength-medium');
                    strengthText.textContent = 'Medium';
                    strengthText.className = 'font-label-sm text-label-sm text-tertiary-container';
                } else if (hasLength && hasComplex) {
                    strengthBar.classList.add('strength-strong');
                    strengthText.textContent = 'Strong';
                    strengthText.className = 'font-label-sm text-label-sm text-secondary';
                } else {
                    strengthBar.classList.add('strength-weak');
                    strengthText.textContent = 'Weak';
                    strengthText.className = 'font-label-sm text-label-sm text-error';
                }

                checkMatch();
            });

            // Confirm Match Logic
            const checkMatch = () => {
                if (confirmInput.value.length > 0 && confirmInput.value !== pwdInput.value) {
                    matchError.classList.remove('hidden');
                    confirmInput.classList.add('border-error');
                } else {
                    matchError.classList.add('hidden');
                    confirmInput.classList.remove('border-error');
                }
            };

            confirmInput.addEventListener('input', checkMatch);

            // Form Submit Prevent Default
            document.getElementById('resetForm').addEventListener('submit', (e) => {
                e.preventDefault();
                if(pwdInput.value === confirmInput.value) {
                    // Success visual feedback
                    const btn = e.target.querySelector('button[type="submit"]');
                    btn.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span>';
                    setTimeout(() => {
                        btn.innerHTML = 'Password Updated <span class="material-symbols-outlined ml-xs text-[18px]">check</span>';
                        btn.classList.replace('bg-primary', 'bg-secondary');
                    }, 1500);
                }
            });
        });
    </script>
</body></html>
