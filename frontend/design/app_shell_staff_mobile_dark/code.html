<style>
        body {

            color: #dae2fd;

        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(70, 69, 84, 0.3);
        }
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        /* Mobile adjustment for standard top bar since it's "small" type in JSON */
        .mobile-shell-padding {
            padding-top: 64px;
            padding-bottom: 80px;

<body class="bg-background text-on-background min-h-screen overflow-x-hidden">
<!-- TopNavBar: Execution of Shared Component JSON -->
<header class="w-full h-16 fixed top-0 left-0 z-50 flex justify-between items-center px-margin-mobile bg-surface dark:bg-surface border-b border-outline-variant dark:border-outline-variant transition-colors duration-200">
<div class="flex items-center gap-md">
<button class="p-sm rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">menu</span>
</button>
<span class="font-headline-sm text-headline-sm font-bold text-primary dark:text-primary">Nexus CRM</span>
</div>
<div class="flex items-center gap-sm">
<button class="p-sm rounded-full hover:bg-surface-container-high dark:hover:bg-surface-container-high transition-colors text-on-surface">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="w-8 h-8 rounded-full overflow-hidden border border-outline">
<img class="w-full h-full object-cover" data-alt="A professional studio portrait of a corporate staff member with a friendly smile, set against a dark, moody blue background that matches the enterprise software aesthetic. The lighting is soft and cinematic, highlighting the professional attire and modern, systematic vibe of the Nexus CRM brand." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA6Xxn-4V0_LKeqjuwe5s-4gohnu6uJX3AKpEvRz33VDDFOFftedmPpISv5MwmTp7tEBoGUAI90wRaTvv-svBi7rCIfBLju79rnKfOCVH9lSGK9_tvu-tr_oOWM8WUmGYHoVfRXmz1f2q8omAOCMTpGJMe11wVrgR42dH1XCEcAshbqKhYjkZbA8OVhKF_SYyMurLvf4yTykMe_6ivLTUDu7A-JiAkZ7hukhCFHYtfX62URmgQzkP-adjX3J5L9sRfblp2YJ9PyDNw8"/>
</div>
</div>
</header>
<!-- Main Canvas -->
<main class="mobile-shell-padding min-h-screen flex flex-col items-center justify-center px-margin-mobile">
<!-- Dashboard Empty State -->
<div class="w-full max-w-md text-center space-y-lg animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Decorative Visual for Empty State -->
<div class="relative w-48 h-48 mx-auto mb-xl">
<div class="absolute inset-0 bg-primary-container/10 rounded-full blur-3xl"></div>
<div class="relative glass-card w-full h-full rounded-3xl flex items-center justify-center overflow-hidden border-outline-variant">

<span class="material-symbols-outlined text-[64px] text-primary" style="font-variation-settings: 'wght' 300;">query_stats</span>
</div>
<!-- Floaties -->
<div class="absolute -top-4 -right-4 p-md glass-card rounded-xl shadow-2xl animate-bounce" style="animation-duration: 4s;">
<span class="material-symbols-outlined text-tertiary">trending_up</span>
</div>
<div class="absolute -bottom-2 -left-6 p-sm glass-card rounded-xl shadow-2xl animate-pulse">
<span class="material-symbols-outlined text-secondary">group</span>
</div>
</div>
<!-- Content -->
<div class="space-y-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Dashboard</h1>
<p class="font-body-md text-body-md text-on-surface-variant px-md">No recent activity. Your client interactions and data insights will appear here once you start recording data.</p>
</div>
<div class="pt-lg flex flex-col gap-md">
<button class="w-full py-md px-xl bg-primary text-on-primary font-label-md text-label-md rounded-xl font-bold flex items-center justify-center gap-sm transition-transform active:scale-95 shadow-lg shadow-primary/20">

</button>
<button class="w-full py-md px-xl border border-outline-variant text-on-surface font-label-md text-label-md rounded-xl font-medium hover:bg-surface-container-high transition-colors">
                    Import Existing Data

</div>

<!-- Hint Section: Asymmetric layout element -->

<div class="p-md glass-card rounded-2xl space-y-xs">

<!-- Dashboard (Active) -->
<button class="flex flex-col items-center justify-center gap-1 min-w-[72px] h-full transition-all duration-200">
<div class="bg-secondary-container dark:bg-secondary-container text-on-secondary-container dark:text-on-secondary-container px-5 py-1 rounded-full flex items-center justify-center mb-1">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">dashboard</span>
</div>
<span class="font-label-sm text-label-sm font-bold text-primary">Dashboard</span>
</button>
<!-- Clients -->
<button class="flex flex-col items-center justify-center gap-1 min-w-[72px] h-full transition-all duration-200 text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined mb-1">group</span>
<span class="font-label-sm text-label-sm">Clients</span>
</button>
<!-- Events -->
<button class="flex flex-col items-center justify-center gap-1 min-w-[72px] h-full transition-all duration-200 text-on-surface-variant hover:text-on-surface">
<span class="material-symbols-outlined mb-1">event</span>
<span class="font-label-sm text-label-sm">Events</span>
</button>

<span class="material-symbols-outlined mb-1">settings</span>
<span class="font-label-sm text-label-sm">Settings</span>
</button>
</nav>
<!-- Floating Action Button (FAB) for Contextual Action: "New Record" -->
<button class="fixed bottom-24 right-6 w-14 h-14 rounded-2xl bg-tertiary-container text-on-tertiary-container shadow-2xl flex items-center justify-center active:scale-90 transition-transform z-40">
<span class="material-symbols-outlined text-[28px]">add</span>
</button>
<script>
        // Simple Micro-interaction for feedback
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', function() {
                this.classList.add('opacity-70');
            });
            button.addEventListener('touchend', function() {
                this.classList.remove('opacity-70');
            });
        });

        // Interactive "Empty State" hover effect for desktop testing
        const card = document.querySelector('.glass-card');
        if(card) {
            card.addEventListener('mousemove', (e) => {
                const rect = card.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                card.style.setProperty('--mouse-x', `${x}px`);
                card.style.setProperty('--mouse-y', `${y}px`);
            });
        }
    </script>
