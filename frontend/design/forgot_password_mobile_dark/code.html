<body class="flex flex-col min-h-screen text-on-surface">
<!-- TopAppBar -->
<header class="bg-surface w-full top-0 left-0 fixed z-50">
<div class="flex items-center px-lg h-16 w-full max-w-7xl mx-auto">
<div class="flex items-center gap-md">
<span class="material-symbols-outlined text-primary" data-icon="lock_reset">lock_reset</span>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">SaaS CRM</span>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center px-margin-mobile pt-24 pb-12">
<div class="w-full max-w-md bg-[#1e293b] border border-[#334155] rounded-xl p-lg shadow-xl relative overflow-hidden">
<!-- Subtle atmospheric glow background -->
<div class="absolute -top-24 -right-24 w-48 h-48 bg-primary/10 blur-[100px] pointer-events-none"></div>
<div class="flex flex-col items-center text-center space-y-md">
<!-- Icon Container -->
<div class="w-16 h-16 rounded-full bg-primary-container/10 flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-primary text-[32px]" data-icon="restart_alt">restart_alt</span>
</div>
<!-- Headline -->
<h1 class="font-headline-md text-headline-md text-on-surface">Forgot Password</h1>
<!-- Instructions -->
<p class="font-body-md text-body-md text-on-surface-variant max-w-[280px]">
                    Enter your email address and we'll send you a link to reset your password.
                </p>
<!-- Form -->
<form class="w-full space-y-lg mt-xl" onsubmit="event.preventDefault();">
<div class="text-left">
<label class="block font-label-md text-label-md text-on-surface-variant mb-xs" for="email">Email Address</label>
<div class="relative flex items-center focused-input">
<span class="absolute left-3 material-symbols-outlined text-outline text-[20px]" data-icon="mail">mail</span>
<input class="w-full bg-[#0f172a] border border-[#334155] rounded-lg py-3 pl-11 pr-4 text-on-surface font-body-md placeholder:text-outline focus:outline-none focus:border-primary-container transition-all" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<button class="w-full bg-primary-container hover:bg-primary-container/90 text-on-primary-container font-headline-sm text-headline-sm py-3 rounded-lg transition-all duration-200 active:scale-[0.98] shadow-lg shadow-primary-container/10" type="submit">
                        Send Reset Link
                    </button>
</form>
<!-- Back to Login -->
<div class="pt-md">
<a class="inline-flex items-center gap-xs font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors group" href="#">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                        Back to Login
                    </a>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="bg-background w-full bottom-0 border-t border-outline-variant">
<div class="flex flex-col md:flex-row justify-between items-center py-xl px-lg w-full max-w-7xl mx-auto gap-md">

<nav class="flex gap-lg">
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-150" href="#">Terms</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-150" href="#">Privacy</a>
<a class="font-body-md text-body-md text-on-surface-variant hover:text-primary transition-colors duration-150" href="#">Contact</a>
</nav>
</div>
</footer>
<script>
        // Simple micro-interaction for button state
        const form = document.querySelector('form');
        const submitBtn = form.querySelector('button');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const originalText = submitBtn.innerText;
            submitBtn.innerText = 'Sending...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-80', 'cursor-not-allowed');

            // Simulate API call
            setTimeout(() => {
                submitBtn.innerText = 'Link Sent!';
                submitBtn.classList.remove('bg-primary-container');
                submitBtn.classList.add('bg-tertiary-container', 'text-on-tertiary-container');
                
                // Show a success message in console or UI
                console.log('Reset link sent to:', document.getElementById('email').value);
            }, 1500);
        });

        // Add subtle hover tracking for the card
        const card = document.querySelector('main div');
        card.addEventListener('mousemove', (e) => {
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            card.style.setProperty('--mouse-x', `${x}px`);
            card.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
