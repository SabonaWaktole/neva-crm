                    "secondary-fixed": "#d4e4fa",
                    "outline": "#908fa0",
                    "on-tertiary-fixed-variant": "#703700",
                    "on-tertiary-fixed": "#301400",
                    "on-secondary-container": "#a7b6cc",
                    "surface-container-high": "#222a3d",
                    "on-tertiary-container": "#452000",
                    "on-primary-fixed": "#07006c",
                    "primary-fixed": "#e1e0ff",

                    "secondary-container": "#39485a"
            },
            "borderRadius": {

                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],

<style>
        body {
            background-color: #0b1326;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .strength-meter-bar {
            transition: width 0.3s ease-in-out, background-color 0.3s ease-in-out;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="text-on-surface antialiased min-h-screen flex flex-col">
<!-- Top AppBar (Brand Anchor) -->
<header class="w-full top-0 left-0 bg-surface dark:bg-on-surface z-50">
<div class="flex items-center px-lg h-16 w-full max-w-max-content-width mx-auto">
<div class="flex items-center gap-md">
<button class="text-primary dark:text-inverse-primary transition-all duration-200 active:opacity-80">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-lg text-headline-lg font-bold text-primary dark:text-primary-fixed">SaaS CRM</span>
</div>
</div>
</header>
<main class="flex-grow flex items-center justify-center px-md py-xl relative overflow-hidden">
<!-- Ambient Background Effect -->
<div class="absolute inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-primary-container rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-tertiary-container rounded-full blur-[120px]"></div>
</div>
<!-- Centered Card Container -->
<div class="relative w-full max-w-md bg-surface-container border border-outline-variant rounded-xl p-lg shadow-2xl backdrop-blur-sm">
<div class="flex flex-col gap-xl">
<!-- Header -->
<div class="text-center space-y-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Reset Password</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please choose a strong password to secure your account.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-lg" onsubmit="return false;">
<!-- New Password Input -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="new-password">New Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-11 pr-md py-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="new-password" oninput="updateStrengthMeter(this.value)" placeholder="Enter new password" type="password"/>
</div>
<!-- Password Strength Meter -->
<div class="space-y-xs pt-xs">
<div class="flex justify-between items-center px-1">
<span class="font-label-sm text-label-sm text-outline" id="strength-text">Strength: Weak</span>
<span class="font-label-sm text-label-sm text-outline" id="strength-percent">0%</span>
</div>
<div class="h-1 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="strength-meter-bar h-full w-0 bg-error" id="strength-bar"></div>
</div>
</div>
</div>
<!-- Confirm Password Input -->
<div class="space-y-sm">
<label class="font-label-md text-label-md text-on-surface-variant block" for="confirm-password">Confirm Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline" data-icon="lock_reset">lock_reset</span>
<input class="w-full bg-surface-container-low border border-outline-variant rounded-lg pl-11 pr-md py-md text-on-surface placeholder:text-outline focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all duration-200" id="confirm-password" placeholder="Confirm your password" type="password"/>
</div>
</div>
<!-- Requirements Chip Group -->
<div class="flex flex-wrap gap-sm">
<div class="flex items-center gap-xs px-sm py-[2px] bg-surface-container-highest rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[14px] text-error" data-icon="check_circle">check_circle</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">8+ Characters</span>
</div>
<div class="flex items-center gap-xs px-sm py-[2px] bg-surface-container-highest rounded-full border border-outline-variant">
<span class="material-symbols-outlined text-[14px] text-outline" data-icon="circle">circle</span>
<span class="font-label-sm text-label-sm text-on-surface-variant">1 Number</span>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary-container hover:bg-primary text-on-primary-container font-semibold py-md rounded-lg shadow-lg shadow-primary-container/10 transition-all duration-200 active:scale-[0.98] mt-md">
                        Reset Password
                    </button>
</form>
<!-- Footer Link -->
<div class="text-center pt-md">
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors duration-150 inline-flex items-center gap-xs" href="#">
<span class="material-symbols-outlined text-[18px]" data-icon="arrow_left_alt">arrow_left_alt</span>
                        Back to Login
                    </a>
</div>
</div>
</div>
</main>
<!-- Footer (Brand Anchor) -->
<footer class="w-full bottom-0 bg-background dark:bg-background border-t border-outline-variant dark:border-outline mt-auto">
<div class="flex flex-col md:flex-row justify-between items-center py-xl px-lg w-full max-w-max-content-width mx-auto gap-md">
<span class="font-label-md text-label-md text-on-surface-variant">© 2026 CRM. All rights reserved.</span>
<div class="flex gap-lg">
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors duration-150" href="#">Terms</a>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors duration-150" href="#">Privacy</a>
<a class="font-body-md text-body-md text-secondary hover:text-primary transition-colors duration-150" href="#">Contact</a>
</div>
</div>
</footer>
<script>
        function updateStrengthMeter(val) {
            const bar = document.getElementById('strength-bar');
            const text = document.getElementById('strength-text');
            const percentText = document.getElementById('strength-percent');
            
            let strength = 0;
            if (val.length > 0) strength += 20;
            if (val.length > 7) strength += 20;
            if (/[0-9]/.test(val)) strength += 20;
            if (/[A-Z]/.test(val)) strength += 20;
            if (/[^A-Za-z0-9]/.test(val)) strength += 20;

            bar.style.width = strength + '%';
            percentText.innerText = strength + '%';

            if (strength <= 20) {
                bar.className = 'strength-meter-bar h-full bg-error';
                text.innerText = 'Strength: Very Weak';
                text.className = 'font-label-sm text-label-sm text-error';
            } else if (strength <= 40) {
                bar.className = 'strength-meter-bar h-full bg-error';
                text.innerText = 'Strength: Weak';
                text.className = 'font-label-sm text-label-sm text-error';
            } else if (strength <= 60) {
                bar.className = 'strength-meter-bar h-full bg-tertiary';
                text.innerText = 'Strength: Fair';
                text.className = 'font-label-sm text-label-sm text-tertiary';
            } else if (strength <= 80) {
                bar.className = 'strength-meter-bar h-full bg-primary-container';
                text.innerText = 'Strength: Good';
                text.className = 'font-label-sm text-label-sm text-primary-container';
            } else {
                bar.className = 'strength-meter-bar h-full bg-primary';
                text.innerText = 'Strength: Strong';
                text.className = 'font-label-sm text-label-sm text-primary';
            }
        }
    </script>
</body></html>
